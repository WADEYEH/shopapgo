<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>APGO 後台</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="./admin.css">
    <script type="module" src="./admin.js"></script>
  </head>
  <body data-page="admin">
    <a class="skip-link" href="#main" data-t="nav.skip">跳到內容</a>
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn" type="button" data-admin-menu aria-expanded="false" aria-controls="admin-nav" data-t-label="nav.menu"></button>
        <a class="topbar__brand" href="./#/"><img src="/us/assets/brand/apgo-logo.png" alt="APGO" width="89" height="24"></a>
        <span class="env-tag" data-admin-env hidden>STAGING</span>
        <span class="topbar__spacer"></span>
        <button class="lang-toggle" type="button" data-admin-lang-toggle></button>
      </header>

      <nav class="side" id="admin-nav" data-admin-nav data-t-label="nav.label">
        <a class="side__brand" href="./#/"><img src="/us/assets/brand/apgo-logo.png" alt="APGO" width="89" height="24"><span data-t="nav.backOffice">後台</span></a>
        <ul class="side__links" data-admin-nav-links></ul>
        <div class="side__foot">
          <div class="seg" role="group" data-t-label="nav.language">
            <button type="button" data-lang="zh" aria-pressed="true">中文</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
          <span class="env-tag" data-admin-env hidden>STAGING</span>
          <p class="side__who" data-admin-whoami hidden></p>
          <button class="btn btn--sm btn--ghost" type="button" data-admin-team-alerts aria-pressed="false" hidden></button>
        </div>
      </nav>
      <div class="scrim" data-admin-scrim hidden></div>

      <main class="main" id="main" tabindex="-1">
        <div class="main__message" data-admin-message aria-live="polite"></div>
        <div class="view" data-admin-view></div>
      </main>
    </div>
  </body>
</html>
