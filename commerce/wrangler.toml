name = "apgo-us-store"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# The site is the Next.js export (../out, built by `npm run build:site`) served as-is: every customer page, the back office
# page (public/admin/) and the files in public/. The Worker runs first for every path: /api/*, the protected /admin/*
# back office, the 301s for moved URLs (worker/redirects.js) and the Apple Pay domain-verification path (wrangler skips
# dot-folders, so the file lives in public/apple-pay/). The asset server also applies public/_redirects, which holds only
# rules the Worker answers first (worker/redirects.js).
[assets]
directory = "../out"
binding = "ASSETS"
not_found_handling = "404-page"   # unknown paths get the site's 404 page
run_worker_first = true

# Create once with `npx wrangler d1 create apgo-us-store`, then paste the id here.
# Local dev (`wrangler dev`) works with the placeholder id.
[[d1_databases]]
binding = "DB"
database_name = "apgo-us-store"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"   # numbered, additive-only migrations (D45): npm run db:migrate:local

# Product photos owners upload in the back office (worker/product-content.js, D61, D62): served at /media/products/*.
# Local dev (`wrangler dev`) keeps its own copy on disk; the bucket name only matters with --remote.
[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "apgo-us-store-images-staging"

# Per-address limits on the endpoints that cost money or invite abuse (worker/rate-limit.js, M12-06): starting a payment,
# the address check (a paid Google API) and quotes. Each environment has its own namespaces.
[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "3101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ADDRESS_LIMITER"
namespace_id = "3102"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "3103"
simple = { limit = 60, period = 60 }

[vars]
# "demo" = Airwallex sandbox. Switch to "prod" only after prices, shipping and
# tax in worker/catalog.js are approved.
AIRWALLEX_ENV = "demo"

# Optional, non-secret store settings (all have safe defaults; see docs/commerce.md):
#   PRICING_JSON      partial override of worker/pricing.js DEFAULT_PRICING (prices, shipping, tax)
#   PRICING_APPROVED  must be "true" before AIRWALLEX_ENV="prod" will take payments
#   APPLE_PAY_ENABLED / GOOGLE_PAY_ENABLED   "false" hides that wallet button (default on)
#   AIRWALLEX_PAY_ENABLED                    "false" hides Airwallex Pay (default on)
#   CARD_PAYMENTS_ENABLED                    "false" hides the Card option and Apple Pay / Google Pay (default on)
#   PAYMENT_AUTO_CAPTURE                     "false" = authorize only (default capture)
#   WALLET_MERCHANT_NAME                     label shown on the wallet sheet (default "APGO")

[observability]
enabled = true

[observability.issues]
enabled = true   # Workers Issues: groups errors and notifies (where to is set in the dashboard, docs/ops/runbook.md)

# Secrets (never commit): set locally in .dev.vars, remotely with
#   npx wrangler secret put AIRWALLEX_CLIENT_ID
#   npx wrangler secret put AIRWALLEX_API_KEY
#   npx wrangler secret put AIRWALLEX_WEBHOOK_SECRET
# PayPal Orders v2 (already set on Cloudflare; Client Secret is Worker-only):
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_ENV (live|sandbox)
#   PAYPAL_WEBHOOK_ID  after the operator registers the Dashboard webhook URL
# Address check at checkout (worker/address-check.js; optional, without it addresses are recorded "unverified"):
#   GOOGLE_ADDRESS_VALIDATION_KEY  Google Cloud API key restricted to the Address Validation API
# Global Privacy Control (worker/privacy.js, D46): honoured by default; a plain var HONOR_GPC = "false" stops honouring it.

# ---------------------------------------------------------------------------------------------------------------
# Environments. The top level above is local dev (`npm run dev`) and is left alone. Wrangler does NOT inherit
# bindings / vars / assets into [env.*], so each environment repeats them. Secrets are per environment too.
#
#   staging     staging.shopapgo.com + admin-staging.shopapgo.com; this repo's test site, the whole site from one Worker:
#               npm run deploy:staging builds the site (scripts/build-site.mjs, test settings) and deploys it
#   production  store.shopapgo.com + admin.shopapgo.com; checkout stays 503 until PRICING_APPROVED (see docs/commerce.md "Go-live checklist").
# ---------------------------------------------------------------------------------------------------------------

[env.staging]
name = "apgo-us-store-staging"
workers_dev = true
preview_urls = false
# Custom domains (zone shopapgo.com). Wrangler creates the DNS records + certificates on deploy; workers.dev stays on.
#   staging.shopapgo.com        the storefront (Basic-auth gate); /admin* answers 404 here
#   admin-staging.shopapgo.com  the order back office on its own host (ADMIN_HOST below); email/password or ADMIN_TOKEN
#   store-staging.shopapgo.com  plays the old store host: pages answer 301 to staging.shopapgo.com, /api/* stays (MOVED_HOSTS)
routes = [
  { pattern = "staging.shopapgo.com", custom_domain = true },
  { pattern = "admin-staging.shopapgo.com", custom_domain = true },
  { pattern = "store-staging.shopapgo.com", custom_domain = true },
]

# Run the Worker next to its D1 database (staging: Asia-Pacific, Osaka) instead of next to the visitor: a back-office
# page makes about ten queries one after another, each a trip across the Pacific from Asia (~0.25 s). Placement hint,
# docs: developers.cloudflare.com/workers/configuration/placement (10/18 trial on staging).
[env.staging.placement]
region = "aws:ap-northeast-3"

[env.staging.assets]
# The site: the Next.js export built for a test site by scripts/build-site.mjs (npm run build:site).
directory = "../out"
binding = "ASSETS"
not_found_handling = "404-page"   # unknown paths get the brand site's 404 page
# true = the Worker runs first for EVERY path, so static pages/images also get the Basic-auth gate and X-Robots-Tag
# (without it Cloudflare serves static files directly, bypassing worker/staging.js). All environments use this gate.
run_worker_first = true

# Staging has its own D1 (created with `npx wrangler d1 create apgo-us-store-staging`; the id is not a secret).
[[env.staging.d1_databases]]
binding = "DB"
database_name = "apgo-us-store-staging"
database_id = "246c3158-a70e-420e-a165-cda01b4ca434"
migrations_dir = "migrations"

# Product photos owners upload in the back office (worker/product-content.js, D61, D62): served at /media/products/*.
# Created 2026-10-12 (location ENAM); its own bucket, never the production one.
[[env.staging.r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "apgo-us-store-images-staging"

# Per-address limits on the endpoints that cost money or invite abuse (worker/rate-limit.js, M12-06): starting a payment,
# the address check (a paid Google API) and quotes. Each environment has its own namespaces.
[[env.staging.ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "3201"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "ADDRESS_LIMITER"
namespace_id = "3202"
simple = { limit = 20, period = 60 }

[[env.staging.ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "3203"
simple = { limit = 60, period = 60 }

[env.staging.vars]
AIRWALLEX_ENV = "demo"   # Airwallex SANDBOX (worker/airwallex.js: anything but "prod" means sandbox)
SITE_ENV = "staging"     # worker/staging.js: noindex header, /robots.txt Disallow, Basic-auth gate
CONFIG_PROFILE = "staging"   # worker/config-check.js: the settings this Worker must have (J6); keep its manifest equal to this file
ADMIN_HOST = "admin-staging.shopapgo.com"   # worker/hosts.js: /admin* only on this host; other hosts 404 it
# worker/redirects.js: the one site host; the hosts in MOVED_HOSTS answer 301 to it (except /api/* and /.well-known/*)
SITE_HOST = "staging.shopapgo.com"
MOVED_HOSTS = "store-staging.shopapgo.com"
ADMIN_ACCEPT_SITE_BASIC = "true"            # staging only: the website Basic login (existing secrets) also opens /admin on ADMIN_HOST
# Back-office members (worker/members.js, D44): the first owner; later owners add colleagues on the Members section.
ADMIN_OWNER_EMAIL = "wadeyeh@apgo.com.tw"
# Cloudflare Access sign-in (worker/admin-identity.js; M4, on since 10/15, docs/ops/runbook.md section 11): team "apgo",
# application "shopapgo back office (staging)" on admin-staging.shopapgo.com, policy "shopapgo back office members"
# (emails in the Zero Trust list below). The site Basic login and the shared login no longer open /admin; ADMIN_TOKEN still
# does, for scripts (role member), which pass Cloudflare with a service token. None of these values is a secret.
ADMIN_ACCESS = "true"
ACCESS_TEAM_DOMAIN = "https://apgo.cloudflareaccess.com"
ACCESS_AUD = "dc006dbb80b89d40c57c502cdde1bf61379a57b6436bbd7ac13cb85825e1c1f6"
# The member list kept equal to Cloudflare's allowed-email list (worker/access-list.js): Zero Trust list
# "apgo-backoffice-members"; the secret ACCESS_LIST_API_TOKEN ("backoffice-member-list", Zero Trust: Edit on this account).
CLOUDFLARE_ACCOUNT_ID = "71eb47531bc5b2d880acc57b74989146"
ACCESS_LIST_ID = "86679123-d156-420e-ad3b-66075645d1ee"
CUSTOMER_EMAIL_FROM = "APGO <orders@shopapgo.com>"   # O8: shopapgo.com verified in Resend 10/11 (us-east-1); production switches at the cutover
CUSTOMER_EMAIL_REPLY_TO = "services@apgo.com.tw"
CUSTOMER_EMAIL_TEST_RECIPIENTS = "wadeyeh@apgo.com.tw" # owner-approved staging recipient; all other recipients are blocked
CONTACT_EMAIL_TO = "wadeyeh@apgo.com.tw"   # worker/contact.js: Contact us messages go to the approved test recipient on staging
TURNSTILE_SITE_KEY = "0x4AAAAAAFXdvG8hkAH0UWBo"   # M11 (10/15): Turnstile widget "shopapgo contact form" (shopapgo.com and subdomains); the secret TURNSTILE_SECRET_KEY is set
CUSTOMER_EMAIL_POLICY_NOTE = "TEST EMAIL - Sample order and shipping details only. No payment or shipment took place."
CUSTOMER_EMAIL_ENABLED = "true"             # staging only: dedicated key configured, exact owner-approved recipient allowlist
CUSTOMER_EMAIL_RETRY_CRON = "true"          # recovers new payment instructions and outbox rows; no historical backfill
REFUND_ALERT_EMAIL_TO = "wadeyeh@apgo.com.tw" # owner-approved test mailbox only; set a production team recipient separately
# Amazon has no test environment, so staging sends orders to a fake (worker/fake-amazon.js) that takes the order, ships it
# after a few minutes and can play out a stock-out. MCF_FAKE only works with SITE_ENV=staging; anywhere else it stops all
# sending instead (never the real service). Auto-submit and the status sync run against the fake.
MCF_FAKE = "true"
MCF_AUTO_SUBMIT = "true"
MCF_SYNC_CRON = "true"
# Secrets (wrangler secret put <NAME> --env staging): AIRWALLEX_CLIENT_ID, AIRWALLEX_API_KEY (sandbox keys only),
# ADMIN_LOGIN_EMAIL, ADMIN_LOGIN_PASSWORD, ADMIN_TOKEN, STAGING_BASIC_AUTH_USER, STAGING_BASIC_AUTH_PASSWORD;
# AIRWALLEX_WEBHOOK_SECRET once the sandbox webhook exists.
# PayPal sandbox: PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_ENV=sandbox; PAYPAL_WEBHOOK_ID after registering
# https://staging.shopapgo.com/api/webhooks/paypal in the PayPal sandbox Dashboard.

[env.staging.observability]
enabled = true

[env.staging.observability.issues]
enabled = true

[env.staging.triggers]
crons = ["*/2 * * * *"]

# The version this Worker runs, for its own settings check after every deploy (worker/config-check.js).
[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# Production: store.shopapgo.com (storefront) + admin.shopapgo.com (back office: ADMIN_LOGIN_EMAIL/PASSWORD or ADMIN_TOKEN). Checkout answers 503 until PRICING_APPROVED="true".
[env.production]
name = "apgo-us-store"
workers_dev = false
# Custom domains (zone shopapgo.com). Wrangler creates the DNS records + certificates on deploy.
routes = [
  { pattern = "store.shopapgo.com", custom_domain = true },
  { pattern = "admin.shopapgo.com", custom_domain = true },   # back office on its own host (ADMIN_HOST below); the store host answers 404 for /admin*
  # www.shopapgo.com and the bare domain, whole hosts: the cutover deploy (docs/commerce-plan.md stage 4) takes all of
  # www from Cloudflare Pages to this Worker. The www DNS record stays as it is (Pages); a Workers route runs in front of
  # it, as the store paths already did since 2026-10-06. Routes are not part of a Worker version: rolling back the
  # version keeps these routes, so moving www back to Pages means deploying a config without them (runbook section 24).
  { pattern = "www.shopapgo.com/*", zone_name = "shopapgo.com" },
  { pattern = "shopapgo.com/*", zone_name = "shopapgo.com" },
]

# Do NOT deploy main here before the cutover (docs/commerce-plan.md §6, stage 4). Every customer page is a Next.js page
# now (D41) and needs www's /_next/* from the same build, so the deploy that brings this site to production also moves
# all of www to this Worker (the routes above change then). Until that deploy nothing below takes effect.
[env.production.assets]
directory = "../out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

# Production D1 (created with `npx wrangler d1 create apgo-us-store`; the id is not a secret).
[[env.production.d1_databases]]
binding = "DB"
database_name = "apgo-us-store"
database_id = "b409b132-2f2d-4da8-970c-2cf5560ac830"
migrations_dir = "migrations"   # applied only by the Deploy workflow, after it records a restore point (docs/ops/runbook.md)

# Product photos owners upload in the back office (worker/product-content.js, D61, D62): served at /media/products/*.
# Created 2026-10-12 (location ENAM). Not the older apgo-product-images bucket, which belongs to another project.
[[env.production.r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "apgo-us-store-images"

# Per-address limits on the endpoints that cost money or invite abuse (worker/rate-limit.js, M12-06): starting a payment,
# the address check (a paid Google API) and quotes. Each environment has its own namespaces.
[[env.production.ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "3301"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "ADDRESS_LIMITER"
namespace_id = "3302"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "3303"
simple = { limit = 60, period = 60 }

[env.production.vars]
AIRWALLEX_ENV = "prod"
CONFIG_PROFILE = "production"   # worker/config-check.js: the settings this Worker must have (J6); keep its manifest equal to this file
# GA4 refund events (worker/ga4.js, K3): the measurement id is public; the secret GA4_API_SECRET (a Measurement Protocol
# API secret from GA4 → Data streams → shopapgo.com) is created and set at the cutover (D58). Without it nothing is sent.
GA4_MEASUREMENT_ID = "G-YM10YMKE30"
ADMIN_HOST = "admin.shopapgo.com"   # worker/hosts.js: /admin* only on this host; the store host 404s it
# worker/redirects.js (D37, D39): www is the one site host; store.shopapgo.com and the bare domain answer 301 to the
# same page there, except /api/* (webhooks still arrive on store until the providers point at www) and /.well-known/*.
SITE_HOST = "www.shopapgo.com"
MOVED_HOSTS = "store.shopapgo.com,shopapgo.com"
# Back-office members (worker/members.js, D44): the first owner; later owners add colleagues on the Members section.
ADMIN_OWNER_EMAIL = "wadeyeh@apgo.com.tw"
# Cloudflare Access sign-in (worker/admin-identity.js; C17, 10/18, docs/ops/runbook.md section 11): team "apgo",
# application "shopapgo back office (production)" on admin.shopapgo.com (Google or an email code, 24 hours), policy
# "shopapgo back office members (production)" = the emails in the Zero Trust list below. No service token: scripts do not
# get into the production back office (owner 10/18). The shared login (ADMIN_LOGIN_*) and ADMIN_TOKEN stay set but no
# longer open /admin while this is on (owner 10/18: keep them). None of these values is a secret.
ADMIN_ACCESS = "true"
ACCESS_TEAM_DOMAIN = "https://apgo.cloudflareaccess.com"
ACCESS_AUD = "10359036cf5986317a667fe3a9eef8c2ee4930f19e8ed215d6f471113681202a"
# The member list kept equal to Cloudflare's allowed-email list (worker/access-list.js): Zero Trust list
# "apgo-backoffice-members-production" (separate from staging's); the secret ACCESS_LIST_API_TOKEN
# ("backoffice-member-list-production", Zero Trust: Edit on this account).
CLOUDFLARE_ACCOUNT_ID = "71eb47531bc5b2d880acc57b74989146"
ACCESS_LIST_ID = "013e636e-54ff-4339-b3c5-5728e1b1928a"
# Meta Conversions API (worker/meta-capi.js). The dataset (pixel) id is public, not a secret. Without it the whole CAPI
# path is skipped, which is why staging / local have no such line. Secrets: META_CAPI_ACCESS_TOKEN (and META_TEST_EVENT_CODE
# while testing), set by the owner with `wrangler secret put <NAME> --env production`. See docs/meta-tracking.md.
META_DATASET_ID = "2606879866471418"
# Contact us form (worker/contact.js, D28): messages go to the customer-service inbox, sent with the order-email sender
# (RESEND_API_KEY + CUSTOMER_EMAIL_FROM), with a Turnstile bot check (M11, 10/15: widget "shopapgo contact form"; the
# secret TURNSTILE_SECRET_KEY is set; the live landing code does not use it). The receiving inbox is the owner's choice (2026-10-08).
CONTACT_EMAIL_TO = "wadeyeh@apgo.com.tw"
TURNSTILE_SITE_KEY = "0x4AAAAAAFXdvG8hkAH0UWBo"
# Payment methods (D70, owner 10/16): the production Airwallex account cannot take cards yet (M18), so the site opens
# with PayPal (which also takes cards as a guest checkout) and Airwallex Pay. Once Airwallex enables cards, set this to
# "true" (or delete the line) and deploy: the Card option, Apple Pay and Google Pay come back.
CARD_PAYMENTS_ENABLED = "false"
# Email (worker/customer-email.js, worker/notify.js), with the secret RESEND_API_KEY. Plain vars on purpose: they take
# effect with the cutover deploy only. The live landing code falls back to ORDER_NOTIFY_EMAIL_FROM for customer mail,
# so setting these on it before the cutover would start emails to real customers from the old store (10/15).
CUSTOMER_EMAIL_FROM = "APGO <orders@shopapgo.com>"   # O8: shopapgo.com verified in Resend (SPF, DKIM, DMARC pass, C5)
CUSTOMER_EMAIL_REPLY_TO = "services@apgo.com.tw"
CUSTOMER_EMAIL_RETRY_CRON = "true"          # the */5 cron retries emails that failed (the outbox)
ORDER_NOTIFY_EMAIL_TO = "wadeyeh@apgo.com.tw"   # new paid order email to the team (M17, owner 10/15: this address for now)
ORDER_NOTIFY_EMAIL_FROM = "APGO <orders@shopapgo.com>"
REFUND_ALERT_EMAIL_TO = "wadeyeh@apgo.com.tw"   # a refund that failed
# Amazon MCF (worker/mcf.js): paid orders go to Amazon after the one-hour change window, and the cron reads back the
# shipment status. Switched on after the cutover's Hold test order passed (runbook section 15, D26).
MCF_AUTO_SUBMIT = "true"
MCF_SYNC_CRON = "true"
# ADMIN_ACCEPT_SITE_BASIC is deliberately NOT set: production has no website Basic login. With ADMIN_ACCESS on (above),
# admin login is Cloudflare Access only; ADMIN_LOGIN_EMAIL + ADMIN_LOGIN_PASSWORD and ADMIN_TOKEN would open /admin again
# only if ADMIN_ACCESS were switched off.
# PRICING_APPROVED is deliberately NOT set: with AIRWALLEX_ENV=prod checkout answers 503 until the owner approves
# prices / shipping / tax and sets PRICING_APPROVED = "true". SITE_ENV is deliberately not set either (no staging gate).
# Secrets (wrangler secret put <NAME> --env production): AIRWALLEX_CLIENT_ID, AIRWALLEX_API_KEY (production keys),
# AIRWALLEX_WEBHOOK_SECRET, ADMIN_LOGIN_EMAIL, ADMIN_LOGIN_PASSWORD, ADMIN_TOKEN, META_CAPI_ACCESS_TOKEN,
# plus the optional notification / email / MCF secrets.
# PayPal live: PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_ENV=live; PAYPAL_WEBHOOK_ID after registering
# https://store.shopapgo.com/api/webhooks/paypal (and www path-route equivalent) in the PayPal live Dashboard.

# Cron: every 5 minutes the Worker's scheduled() (worker/cron.js) re-sends Meta CAPI events that failed, retries customer
# emails and (only when the MCF_SYNC_CRON var is switched on) syncs Amazon MCF shipment status; each run is recorded for
# GET /api/health and pings HEALTHCHECK_PING_URL (a secret, optional) so a stopped cron raises an alert. Staging runs every
# 2 minutes; local dev has no cron. Every job is a no-op when its switch is off.
[env.production.triggers]
crons = ["*/5 * * * *"]

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.observability]
enabled = true

[env.production.observability.issues]
enabled = true
