<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Orders · APGO back office</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/commerce.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module" src="../js/admin.js"></script>
  </head>
  <body data-page="admin">
    <header class="shop-header">
      <div class="shop-header__inner">
        <a class="shop-header__logo" href="./" aria-label="APGO orders"><img src="../assets/brand/apgo-logo.png" alt="APGO" width="89" height="24"></a>
        <nav class="shop-header__nav" aria-label="Back office">
          <span class="admin-tag">Back office</span>
        </nav>
      </div>
    </header>

    <main class="shop-main admin-main" id="main">
      <div class="shop-intro">
        <p class="eyebrow">Orders</p>
        <h1 class="heading-guide-h1 admin-title">Orders</h1>
      </div>

      <div data-admin-message aria-live="polite"></div>

      <div class="admin-toolbar">
        <div class="admin-tabs" role="group" aria-label="Filter by status" data-admin-tabs></div>
        <div class="admin-tabs" role="group" aria-label="Filter by shipping" data-admin-fulfillment-tabs></div>
        <button class="btn btn--sm" type="button" data-admin-mcf-sync-all>Sync MCF status</button>
        <form class="admin-search" role="search" data-admin-search>
          <label class="visually-hidden" for="admin-q">Search orders</label>
          <input id="admin-q" name="q" type="search" placeholder="Order, email or name" autocomplete="off">
          <button class="btn btn--sm" type="submit">Search</button>
        </form>
      </div>

      <div class="admin-grid">
        <section aria-labelledby="orders-heading" class="admin-list-wrap">
          <h2 class="visually-hidden" id="orders-heading">Order list</h2>
          <ul class="admin-list" data-admin-list></ul>
          <div class="admin-more" data-admin-more hidden>
            <button class="btn btn--sm btn--text" type="button" data-admin-load-more>Load older orders</button>
          </div>
        </section>

        <section class="admin-detail" aria-labelledby="detail-heading" data-admin-detail tabindex="-1">
          <h2 class="visually-hidden" id="detail-heading">Order detail</h2>
          <p class="body body--sm" data-admin-detail-empty>Select an order to see its address, items and payment.</p>
          <div data-admin-detail-body hidden></div>
        </section>
      </div>
    </main>
  </body>
</html>
