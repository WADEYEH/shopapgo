# Vercel only runs `next build`, so without this workflow `npm test` never runs on a
# push and the guards in tests/ are dead weight. The sitemap drift test in particular
# only earns its keep if something executes it automatically: a new guide page that is
# missing from app/sitemap.js otherwise builds green and ships with a silent indexing gap.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The Worker serves this export as it is: check it has the pages, the back office and the files the Worker needs.
      - run: node commerce/scripts/build-site.mjs --check

  commerce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            commerce/package-lock.json
      # The site's own packages too: the browser tests run against the site, the Next.js export (npm run build:site).
      - run: npm ci --prefix ..
      - run: npm ci
      - run: npm run test:static
      # The Worker serves the site build (../out), so the bundle check needs it first.
      - run: npm run build:site
      - run: npm run verify:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  amazon-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amazon-spapi-mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # The Amazon gateway Worker (amazon-spapi-mcp/README.md): its config and code still build. No login, nothing uploaded.
      - run: npx --yes wrangler@4.158.0 deploy --dry-run --outdir dist
      # The Amazon tools' sign-in front and the review-request backup trigger (C32): the same check.
      - run: npx --yes wrangler@4.158.0 deploy --dry-run --outdir dist
        working-directory: amazon-connect
      - run: npx --yes wrangler@4.158.0 deploy --dry-run --outdir dist
        working-directory: amazon-review-cron
