# Deploys the store Worker (commerce/, Cloudflare Workers + D1). Plan: docs/design/phase3-plan.md (PR 3-1); how to run,
# restore and roll back: docs/ops/runbook.md.
#
# - staging: automatically after CI passes on a push to main (the exact commit CI tested), or by hand. Builds the test
#   site, applies the D1 migrations (wrangler applies each numbered file once) and deploys.
# - production: only by hand (Run workflow -> target "production", confirm "deploy production"), only from main, only
#   while the repository variable PRODUCTION_DEPLOY_ENABLED is "true" (switched on at the cutover), and only after a
#   reviewer approves the "production" environment. It runs the tests again, records the database restore point in the
#   run summary, then migrates and deploys.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Without them nothing is deployed and the run
# says so; nobody deploys production from a laptop.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: 'Production only: type "deploy production"'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed (docs/ops/runbook.md)."
          fi

  staging:
    needs: credentials
    if: >-
      needs.credentials.outputs.ready == 'true' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
        || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # After CI: the commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            commerce/package-lock.json
      - run: npm ci --prefix ..
      - run: npm ci
      - run: npm run build:site
      - name: Apply database migrations (staging)
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy (staging)
        run: npx wrangler deploy --env staging
      - name: Check the test site answers
        # robots.txt is the one staging path outside the Basic-auth gate.
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://staging.shopapgo.com/robots.txt

  production:
    needs: credentials
    if: >-
      needs.credentials.outputs.ready == 'true'
      && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
      && inputs.confirm == 'deploy production'
      && github.ref == 'refs/heads/main'
      && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Required reviewers are set on this environment (Settings -> Environments -> production): the job waits for one.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            commerce/package-lock.json
      - run: npm ci --prefix ..
      - run: npm ci
      - name: Tests (site and store)
        run: |
          npm test --prefix ..
          npm run test:static
      - name: Build the production site
        env:
          NEXT_PUBLIC_APGO_US_ANALYTICS_READY: ${{ vars.APGO_US_ANALYTICS_READY }}
          NEXT_PUBLIC_APGO_US_GTM_ID: ${{ vars.APGO_US_GTM_ID }}
          NEXT_PUBLIC_APGO_US_META_PIXEL_ID: ${{ vars.APGO_US_META_PIXEL_ID }}
        run: node scripts/build-site.mjs --production
      - run: npm run verify:bundle
      - name: Record the database restore point
        run: |
          npx wrangler d1 time-travel info DB --env production --json > restore-point.json
          {
            echo "### Database restore point (before this deploy)"
            echo '```json'
            cat restore-point.json
            echo '```'
            echo "To undo the migrations: docs/ops/runbook.md, \"Restore the database\"."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply database migrations (production)
        run: npx wrangler d1 migrations apply DB --env production --remote
      - name: Deploy (production)
        run: npx wrangler deploy --env production
      - name: Check the store answers
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://www.shopapgo.com/api/store/config > /dev/null
