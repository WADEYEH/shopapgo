# Deploys the Amazon gateway Worker (amazon-spapi-mcp/, https://amazon-mcp.apgo.tw): the store's Amazon fulfillment
# API, the Amazon MCP tools and the review-request scheduler. See amazon-spapi-mcp/README.md and docs/ops/runbook.md
# section 25.
#
# Only by hand (Run workflow, from main, confirm "deploy amazon gateway") and only after a reviewer approves the
# "production" environment. Needs the environment secret AMAZON_GATEWAY_DEPLOY_TOKEN (a Cloudflare token that can edit
# Workers on the company account and Workers routes on apgo.tw) and the repository secret CLOUDFLARE_ACCOUNT_ID.
name: Deploy Amazon gateway

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy amazon gateway"'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy amazon gateway'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-amazon-gateway
      cancel-in-progress: false
    defaults:
      run:
        working-directory: amazon-spapi-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.AMAZON_GATEWAY_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.144.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Credentials are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::AMAZON_GATEWAY_DEPLOY_TOKEN (production environment) or CLOUDFLARE_ACCOUNT_ID is not set (docs/ops/runbook.md section 25)."
            exit 1
          fi
      - name: Builds (dry run)
        run: $WRANGLER deploy --dry-run --outdir dist
      - name: Record the version live before this deploy
        run: |
          $WRANGLER deployments status > before.txt
          {
            echo "### Live before this deploy (roll back to it with \`wrangler rollback <id>\`)"
            echo '```'
            cat before.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy
        run: $WRANGLER deploy
      - name: Check it answers with this version
        run: |
          expected=$(grep -o 'version: "[0-9][0-9.]*"' src/worker.js | tail -1 | grep -o '[0-9][0-9.]*')
          for i in 1 2 3 4 5 6; do
            live=$(curl --silent --show-error https://amazon-mcp.apgo.tw/health | grep -o '"version":"[^"]*"' | grep -o '[0-9][0-9.]*' || true)
            [ "$live" = "$expected" ] && { echo "amazon-mcp.apgo.tw answers version $live"; exit 0; }
            sleep 10
          done
          echo "::error::amazon-mcp.apgo.tw/health answers version '$live', expected '$expected'"
          exit 1
